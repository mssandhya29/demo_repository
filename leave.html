<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Leave Request Management</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --surface: #161616;
      --surface2: #1f1f1f;
      --border: #2a2a2a;
      --accent: #c8f135;
      --accent2: #f1c835;
      --text: #f0ede8;
      --muted: #7a7a72;
      --danger: #ff5e5e;
      --success: #c8f135;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px;
    }

    header { text-align: center; margin-bottom: 52px; }

    .eyebrow {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    h1 { font-size: clamp(2rem, 5vw, 3.4rem); font-weight: 800; line-height: 1.05; letter-spacing: -0.03em; }
    h1 span { color: var(--accent); }

    .subtitle { margin-top: 14px; font-size: 15px; color: var(--muted); font-weight: 400; max-width: 420px; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 820px;
      margin-bottom: 24px;
    }

    .section-title {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    @media (max-width: 560px) { .form-grid { grid-template-columns: 1fr; } }

    .field { display: flex; flex-direction: column; gap: 6px; }
    .field.full { grid-column: 1 / -1; }

    label {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.15em;
      color: var(--muted);
      text-transform: uppercase;
    }

    input, select, textarea {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      width: 100%;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    select option { background: var(--surface2); }

    textarea { resize: vertical; min-height: 80px; }

    .submit-btn {
      width: 100%;
      padding: 16px;
      background: var(--accent);
      color: #0d0d0d;
      border: none;
      border-radius: 10px;
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 8px;
    }

    .submit-btn:hover { opacity: 0.9; }
    .submit-btn:active { transform: scale(0.99); }

    .toast {
      display: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      margin-top: 16px;
    }

    .toast.success { background: rgba(200,241,53,0.08); border: 1px solid rgba(200,241,53,0.3); color: var(--success); display: block; }
    .toast.error { background: rgba(255,94,94,0.06); border: 1px solid rgba(255,94,94,0.3); color: var(--danger); display: block; }

    table { width: 100%; border-collapse: collapse; }
    th {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: left;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
    }

    td {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      padding: 12px 12px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
    }

    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface2); }

    .badge {
      display: inline-block;
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      padding: 3px 10px;
      border-radius: 99px;
      border: 1px solid var(--border);
      color: var(--muted);
      letter-spacing: 0.08em;
    }

    .badge.pending { border-color: var(--accent2); color: var(--accent2); }
    .badge.approved { border-color: var(--success); color: var(--success); }
    .badge.rejected { border-color: var(--danger); color: var(--danger); }

    .empty-state {
      text-align: center;
      padding: 32px;
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <header>
    <p class="eyebrow">HR Portal</p>
    <h1>Leave <span>Request</span></h1>
    <p class="subtitle">Submit and track employee leave requests.</p>
  </header>

  <!-- Submit form -->
  <div class="card">
    <p class="section-title">New Leave Request</p>
    <form id="leaveForm">
      <div class="form-grid">
        <div class="field full">
          <label for="employee_name">Employee Name</label>
          <input type="text" id="employee_name" placeholder="Enter full name" required />
        </div>
        <div class="field">
          <label for="start_date">Start Date</label>
          <input type="date" id="start_date" required />
        </div>
        <div class="field">
          <label for="end_date">End Date</label>
          <input type="date" id="end_date" required />
        </div>
        <div class="field full">
          <label for="reason">Reason (optional)</label>
          <textarea id="reason" placeholder="Describe the reason for leave…"></textarea>
        </div>
      </div>
      <button type="submit" class="submit-btn">Submit Leave Request</button>
    </form>
    <div id="toast" class="toast"></div>
  </div>

  <!-- Leave list -->
  <div class="card">
    <p class="section-title">All Leave Requests</p>
    <div id="leaveTable">
      <div class="empty-state">Loading…</div>
    </div>
  </div>

  <script>
    const API = 'http://localhost:5000/api/leaves';

    async function loadLeaves() {
      try {
        const res = await fetch(API);
        const data = await res.json();
        renderTable(data);
      } catch {
        document.getElementById('leaveTable').innerHTML =
          '<div class="empty-state">Could not connect to server.</div>';
      }
    }

    function renderTable(leaves) {
      const el = document.getElementById('leaveTable');
      if (!leaves.length) {
        el.innerHTML = '<div class="empty-state">No leave requests yet.</div>';
        return;
      }
      el.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Employee</th>
              <th>Start Date</th>
              <th>End Date</th>
              <th>Reason</th>
              <th>Status</th>
              <th>Submitted</th>
            </tr>
          </thead>
          <tbody>
            ${leaves.map(l => `
              <tr>
                <td>${esc(l.employee_name)}</td>
                <td>${esc(l.start_date)}</td>
                <td>${esc(l.end_date)}</td>
                <td>${esc(l.reason || '—')}</td>
                <td><span class="badge ${l.status.toLowerCase()}">${esc(l.status)}</span></td>
                <td>${esc(l.submitted_at ? l.submitted_at.split('T')[0] : '—')}</td>
              </tr>`).join('')}
          </tbody>
        </table>`;
    }

    function esc(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    document.getElementById('leaveForm').addEventListener('submit', async e => {
      e.preventDefault();
      const toast = document.getElementById('toast');
      toast.className = 'toast';

      const body = {
        employee_name: document.getElementById('employee_name').value.trim(),
        start_date: document.getElementById('start_date').value,
        end_date: document.getElementById('end_date').value,
        reason: document.getElementById('reason').value.trim(),
      };

      try {
        const res = await fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Server error');

        toast.textContent = `Leave request submitted for ${data.employee_name} (${data.start_date} → ${data.end_date}).`;
        toast.className = 'toast success';
        e.target.reset();
        loadLeaves();
      } catch (err) {
        toast.textContent = `ERROR: ${err.message}`;
        toast.className = 'toast error';
      }
    });

    loadLeaves();
  </script>
</body>
</html>

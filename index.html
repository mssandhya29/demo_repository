<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Object Counter — AI Vision</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --surface: #161616;
      --surface2: #1f1f1f;
      --border: #2a2a2a;
      --accent: #c8f135;
      --accent2: #f1c835;
      --text: #f0ede8;
      --muted: #7a7a72;
      --danger: #ff5e5e;
      --success: #c8f135;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px;
    }

    header {
      text-align: center;
      margin-bottom: 52px;
    }

    .eyebrow {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3.4rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.03em;
    }

    h1 span {
      color: var(--accent);
    }

    .subtitle {
      margin-top: 14px;
      font-size: 15px;
      color: var(--muted);
      font-weight: 400;
      max-width: 420px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 820px;
    }

    .upload-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }

    @media (max-width: 560px) {
      .upload-grid { grid-template-columns: 1fr; }
    }

    .upload-block {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .step-label {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.15em;
      color: var(--accent);
      text-transform: uppercase;
    }

    .drop-zone {
      border: 1.5px dashed var(--border);
      border-radius: 12px;
      background: var(--surface2);
      min-height: 180px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
      overflow: hidden;
    }

    .drop-zone:hover, .drop-zone.drag-over {
      border-color: var(--accent);
      background: rgba(200, 241, 53, 0.04);
    }

    .drop-zone input[type=file] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .drop-zone img {
      max-height: 160px;
      max-width: 100%;
      object-fit: contain;
      border-radius: 8px;
      pointer-events: none;
    }

    .drop-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }

    .drop-icon {
      width: 40px;
      height: 40px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .drop-icon svg {
      width: 18px;
      height: 18px;
      stroke: var(--muted);
    }

    .drop-text {
      font-size: 13px;
      color: var(--muted);
    }

    .count-btn {
      width: 100%;
      padding: 16px;
      background: var(--accent);
      color: #0d0d0d;
      border: none;
      border-radius: 10px;
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: opacity 0.2s, transform 0.1s;
    }

    .count-btn:hover:not(:disabled) {
      opacity: 0.9;
    }

    .count-btn:active:not(:disabled) {
      transform: scale(0.99);
    }

    .count-btn:disabled {
      background: var(--border);
      color: var(--muted);
      cursor: not-allowed;
    }

    .result-area {
      margin-top: 20px;
    }

    .result-box {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-align: center;
      animation: fadeUp 0.3s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .count-number {
      font-size: 72px;
      font-weight: 800;
      color: var(--accent);
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .count-desc {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
    }

    .result-meta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 6px;
    }

    .badge {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      padding: 4px 12px;
      border-radius: 99px;
      border: 1px solid var(--border);
      color: var(--muted);
      letter-spacing: 0.08em;
    }

    .badge.high { border-color: var(--success); color: var(--success); }
    .badge.medium { border-color: var(--accent2); color: var(--accent2); }
    .badge.low { border-color: var(--danger); color: var(--danger); }

    .notes-text {
      font-size: 13px;
      color: var(--muted);
      max-width: 380px;
      line-height: 1.6;
    }

    .loading-box {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      font-size: 13px;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
    }

    .error-box {
      background: rgba(255,94,94,0.06);
      border: 1px solid rgba(255,94,94,0.3);
      border-radius: 12px;
      padding: 16px 20px;
      font-size: 13px;
      color: var(--danger);
      font-family: 'DM Mono', monospace;
    }

    .divider {
      width: 100%;
      height: 1px;
      background: var(--border);
      margin: 24px 0;
    }

    .api-section {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .api-label {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.15em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .api-input {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      width: 100%;
      outline: none;
      transition: border-color 0.2s;
    }

    .api-input:focus { border-color: var(--accent); }

    .mode-toggle {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .mode-btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: all 0.15s;
    }

    .mode-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #0d0d0d;
    }
  </style>
</head>
<body>

  <header>
    <p class="eyebrow">AI Vision Tool</p>
    <h1>Object <span>Counter</span></h1>
    <p class="subtitle">Upload a reference object, then a scene — the AI counts how many times it appears.</p>
  </header>

  <div class="card">

    <!-- Mode selector -->
    <div class="mode-toggle">
      <button class="mode-btn active" id="modeClient" onclick="setMode('client')">Direct API</button>
      <button class="mode-btn" id="modeServer" onclick="setMode('server')">Python Backend</button>
    </div>

    <!-- API key input (client mode only) -->
    <div id="apiKeySection" class="api-section" style="margin-bottom: 20px;">
      <label class="api-label">Anthropic API Key</label>
      <input class="api-input" type="password" id="apiKey" placeholder="sk-ant-..." />
    </div>

    <!-- Upload grid -->
    <div class="upload-grid">
      <div class="upload-block">
        <span class="step-label">Step 01 — Reference Object</span>
        <div class="drop-zone" id="refZone">
          <input type="file" id="refInput" accept="image/*" onchange="loadImage(event, 'refPreview', 'ref')">
          <div class="drop-placeholder" id="refPreview">
            <div class="drop-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="3"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
                <path d="M21 15l-5-5L5 21"/>
              </svg>
            </div>
            <span class="drop-text">Click or drag image</span>
          </div>
        </div>
      </div>
      <div class="upload-block">
        <span class="step-label">Step 02 — Scene Image</span>
        <div class="drop-zone" id="sceneZone">
          <input type="file" id="sceneInput" accept="image/*" onchange="loadImage(event, 'scenePreview', 'scene')">
          <div class="drop-placeholder" id="scenePreview">
            <div class="drop-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="3"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
                <path d="M21 15l-5-5L5 21"/>
              </svg>
            </div>
            <span class="drop-text">Click or drag image</span>
          </div>
        </div>
      </div>
    </div>

    <button class="count-btn" id="countBtn" disabled onclick="countObjects()">Count Objects</button>

    <div class="result-area" id="resultArea"></div>
  </div>

  <script>
    let state = { ref: { b64: null, mime: null }, scene: { b64: null, mime: null } };
    let mode = 'client';

    function setMode(m) {
      mode = m;
      document.getElementById('modeClient').classList.toggle('active', m === 'client');
      document.getElementById('modeServer').classList.toggle('active', m === 'server');
      document.getElementById('apiKeySection').style.display = m === 'client' ? 'flex' : 'none';
    }

    function loadImage(evt, previewId, key) {
      const file = evt.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        const full = e.target.result;
        state[key].b64 = full.split(',')[1];
        state[key].mime = file.type;
        const el = document.getElementById(previewId);
        el.innerHTML = `<img src="${full}" />`;
        checkReady();
      };
      reader.readAsDataURL(file);
    }

    function checkReady() {
      document.getElementById('countBtn').disabled = !(state.ref.b64 && state.scene.b64);
    }

    async function countObjects() {
      const btn = document.getElementById('countBtn');
      const area = document.getElementById('resultArea');
      btn.disabled = true;
      area.innerHTML = `<div class="loading-box"><div class="spinner"></div><span class="loading-text">Analyzing image…</span></div>`;

      try {
        let result;
        if (mode === 'client') {
          result = await callDirectAPI();
        } else {
          result = await callPythonBackend();
        }
        renderResult(result);
      } catch (err) {
        area.innerHTML = `<div class="error-box">ERROR: ${err.message}</div>`;
      }
      btn.disabled = false;
    }

    async function callDirectAPI() {
      const apiKey = document.getElementById('apiKey').value.trim();
      if (!apiKey) throw new Error('Please enter your Anthropic API key.');

      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-calls': 'true'
        },
        body: JSON.stringify({
          model: 'claude-opus-4-5',
          max_tokens: 512,
          messages: [{
            role: 'user',
            content: [
              { type: 'text', text: 'The first image is the reference object. The second image is the scene. Count how many instances of the reference object appear in the scene. Respond ONLY with valid JSON: {"count": <integer>, "object_name": "<short name>", "confidence": "high|medium|low", "notes": "<one sentence>"}. No markdown, no extra text.' },
              { type: 'image', source: { type: 'base64', media_type: state.ref.mime, data: state.ref.b64 } },
              { type: 'image', source: { type: 'base64', media_type: state.scene.mime, data: state.scene.b64 } }
            ]
          }]
        })
      });

      const data = await res.json();
      if (data.error) throw new Error(data.error.message);
      const raw = data.content.filter(b => b.type === 'text').map(b => b.text).join('');
      return JSON.parse(raw.replace(/```json|```/g, '').trim());
    }

    async function callPythonBackend() {
      const formData = new FormData();
      const refBlob = b64ToBlob(state.ref.b64, state.ref.mime);
      const sceneBlob = b64ToBlob(state.scene.b64, state.scene.mime);
      formData.append('reference', refBlob, 'reference.jpg');
      formData.append('scene', sceneBlob, 'scene.jpg');

      const res = await fetch('http://localhost:5000/count', { method: 'POST', body: formData });
      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.error || 'Server error');
      }
      return res.json();
    }

    function b64ToBlob(b64, mime) {
      const bytes = atob(b64);
      const arr = new Uint8Array(bytes.length);
      for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
      return new Blob([arr], { type: mime });
    }

    function renderResult(parsed) {
      const area = document.getElementById('resultArea');
      const confClass = parsed.confidence || 'medium';
      area.innerHTML = `
        <div class="result-box">
          <div class="count-number">${parsed.count}</div>
          <div class="count-desc">${parsed.object_name || 'object'}${parsed.count !== 1 ? 's' : ''} found</div>
          <div class="result-meta">
            <span class="badge ${confClass}">confidence: ${confClass}</span>
          </div>
          <p class="notes-text">${parsed.notes || ''}</p>
        </div>`;
    }

    // Drag-and-drop support
    ['refZone', 'sceneZone'].forEach(id => {
      const zone = document.getElementById(id);
      zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
      zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
      zone.addEventListener('drop', e => {
        e.preventDefault();
        zone.classList.remove('drag-over');
        const file = e.dataTransfer.files[0];
        if (!file) return;
        const key = id === 'refZone' ? 'ref' : 'scene';
        const previewId = id === 'refZone' ? 'refPreview' : 'scenePreview';
        const fakeEvt = { target: { files: [file] } };
        loadImage(fakeEvt, previewId, key);
      });
    });
  </script>
</body>
</html>
